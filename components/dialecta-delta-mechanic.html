<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#d4a84a;--gold-b:#b8862e;--gold-pale:#f5e8d0;--amber:#b8732a;
  --ink:#1c1814;--body:#3a342c;--sec:#5a5248;--tert:#7a7068;--muted:#9a8e80;
  --cream:#f7f2e8;--white:#fffdf8;--dark:#1c1814;
  --bl:#e8e0d0;--bm:#d8ceb8;--bd:#c8bca4;
  --fd:'Cormorant Garamond',serif;--fb:'DM Sans',sans-serif;--fr:'Source Serif 4',Georgia,serif;--fm:'DM Mono',monospace;
}
html,body{min-height:100%;-webkit-font-smoothing:antialiased}
body{
  font-family:var(--fb);
  background:linear-gradient(135deg,#a8a398 0px,#8c8780 175px,#f7f2e8 775px,#f7f2e8 100%);
  color:var(--body);min-height:100vh;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.035'/%3E%3C/svg%3E");
}
.nav{position:sticky;top:0;z-index:100}
.nav-logo{height:52px;background:linear-gradient(135deg,#f7f2e8 0%,#1c1814 65%,#1c1814 100%);display:flex;align-items:center;border-bottom:1px solid rgba(184,115,42,0.22)}
.nav-logo-inner{max-width:1060px;width:100%;margin:0 auto;padding:0 28px;display:flex;align-items:center}
.nav-wordmark{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;letter-spacing:0.14em;color:#f7f2e8;text-transform:uppercase}
.nav-sub{height:34px;background:linear-gradient(to bottom,#eceae4 0%,#d8d4cc 48%,#eceae4 100%);display:flex;align-items:center;position:relative;border-top:1px solid rgba(255,255,255,0.9);border-bottom:1px solid rgba(255,255,255,0.9)}
.nav-sub::before,.nav-sub::after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,rgba(255,255,255,0.96),transparent)}
.nav-sub::before{top:0}.nav-sub::after{bottom:0}
.nav-sub-inner{max-width:1060px;width:100%;margin:0 auto;padding:0 16px;display:flex;align-items:center}
.nav-link{font-family:'DM Sans',sans-serif;font-size:0.82rem;color:#3a342c;text-decoration:none;padding:0 13px;height:34px;display:flex;align-items:center;border-right:1px solid rgba(180,175,165,0.28);cursor:pointer;white-space:nowrap}
.nav-link:last-child{border-right:none}
.nav-link.active{background:rgba(212,168,74,0.1);color:#b8862e}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:36px 24px 80px}
.progress-track{display:flex;align-items:center;gap:0;margin-bottom:36px;overflow-x:auto;padding-bottom:4px}
.prog-item{display:flex;align-items:center;gap:6px;flex-shrink:0}
.prog-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:0.58rem;flex-shrink:0;transition:all 0.3s}
.prog-dot.done{background:#d4a84a;border:1px solid #d4a84a;color:#fff}
.prog-dot.active{background:transparent;border:2px solid #d4a84a;color:#d4a84a}
.prog-dot.future{background:transparent;border:1px solid #d8ceb8;color:#7a7068}
.prog-label{font-family:'DM Mono',monospace;font-size:0.57rem;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap}
.prog-label.done{color:#5a5248}
.prog-label.active{color:#d4a84a}
.prog-label.future{color:#7a7068}
.prog-line{width:18px;height:1px;flex-shrink:0;margin:0 4px}
.prog-line.done{background:#d4a84a}
.prog-line.future{background:#e8e0d0}
.card{background:rgba(255,253,248,0.9);border:1px solid #d8ceb8;border-radius:8px;padding:28px 32px;backdrop-filter:blur(6px)}
.card-sm{background:rgba(255,253,248,0.85);border:1px solid #e8e0d0;border-radius:6px;padding:18px 22px}
.eyebrow{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:#d4a84a;margin-bottom:10px}
.display{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;color:#1c1814;line-height:1.18;margin-bottom:10px}
.subtitle{font-family:'Source Serif 4',Georgia,serif;font-size:0.92rem;font-style:italic;color:#5a5248;line-height:1.6}
.mono-sm{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.07em}
.btn-gold{font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;background:#d4a84a;color:#fff;border:none;border-radius:4px;padding:10px 22px;cursor:pointer;letter-spacing:0.03em;transition:background 0.15s}
.btn-gold:hover{background:#b8862e}
.btn-outline{font-family:'DM Sans',sans-serif;font-size:0.78rem;color:#5a5248;background:transparent;border:1px solid #d8ceb8;border-radius:4px;padding:8px 18px;cursor:pointer;transition:border-color 0.15s}
.btn-outline:hover{border-color:#d4a84a}
.read-bar{height:2px;background:#e8e0d0;border-radius:1px;margin-bottom:24px;overflow:hidden}
.read-fill{height:2px;background:#d4a84a;border-radius:1px;transition:width 0.08s linear}
.prose p{font-family:'Source Serif 4',Georgia,serif;font-size:0.94rem;line-height:1.78;color:#3a342c;margin-bottom:18px}
.plot-label{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:#5a5248;text-align:center;margin-bottom:8px}
.plot-label.gold{color:#d4a84a}
.choice-btn{background:rgba(255,253,248,0.92);border:1px solid #d8ceb8;border-radius:6px;padding:16px 20px;cursor:pointer;text-align:left;display:flex;gap:14px;align-items:flex-start;width:100%;transition:border-color 0.15s,background 0.15s;margin-bottom:12px}
.choice-btn:hover{border-color:#d4a84a;background:rgba(255,253,248,1)}
.choice-title{font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:500;color:#1c1814;margin-bottom:4px}
.choice-desc{font-family:'Source Serif 4',Georgia,serif;font-size:0.82rem;font-style:italic;color:#5a5248;line-height:1.5}
.reviser-card{background:rgba(212,168,74,0.06);border:1px solid rgba(212,168,74,0.2);border-radius:6px;padding:16px 20px;margin:20px 0;display:flex;gap:14px;align-items:flex-start}
.agg-bar-wrap{flex:1 1 160px}
.agg-bar-track{height:3px;background:#e8e0d0;border-radius:2px;overflow:hidden;margin-top:4px}
.agg-bar-fill{height:3px;background:#d4a84a;border-radius:2px;transition:width 1s ease}
.delta-chip{font-family:'DM Mono',monospace;font-size:0.59rem;letter-spacing:0.08em;color:#d4a84a;background:rgba(212,168,74,0.1);border:1px solid rgba(212,168,74,0.25);border-radius:3px;padding:3px 9px;display:inline-block;margin-bottom:14px}
.rev-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:0.6rem;flex-shrink:0}
.rev-circle.earned{background:#d4a84a;border:2px solid #d4a84a;color:#fff}
.rev-circle.empty{background:transparent;border:2px solid #d8ceb8;color:#7a7068}
textarea{width:100%;min-height:130px;padding:14px 16px;font-family:'Source Serif 4',Georgia,serif;font-size:0.91rem;line-height:1.68;color:#3a342c;background:rgba(255,253,248,0.97);border:1px solid #d8ceb8;border-radius:6px;resize:vertical;outline:none;transition:border-color 0.15s}
textarea:focus{border-color:#d4a84a}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo">
    <div class="nav-logo-inner">
      <span class="nav-wordmark">Dialecta</span>
    </div>
  </div>
  <div class="nav-sub">
    <div class="nav-sub-inner">
      <span class="nav-link">Articles</span>
      <span class="nav-link">Forum</span>
      <span class="nav-link">Opinion Maps</span>
      <span class="nav-link active">Your Delta</span>
      <span class="nav-link">The Pact</span>
    </div>
  </div>
</nav>
<main id="app"></main>
<script>
let state={step:0,before:{x:0.44,y:0.42},after:{x:0.44,y:0.42},afterTouched:false,publicChoice:null,draft:"",readProgress:0,readTimer:null,dragging:false,activePlot:null};
const STEPS=["Before","Reading","After","Delta","Choose","Submit"];
const ARTICLE={title:"The Hidden Costs of Renewable Subsidy Policy",subtitle:"Why the economic case for aggressive market intervention is less clear than its advocates claim.",xLeft:"Market-driven",xRight:"Policy-driven",yTop:"Planet-first",yBot:"Cost-first"};
function getDist(a,b){const dx=(a.x-b.x)*220,dy=(a.y-b.y)*220;return Math.sqrt(dx*dx+dy*dy)}
function deltaDesc(before,after){const dx=after.x-before.x,dy=after.y-before.y,parts=[];if(Math.abs(dx)>0.06)parts.push(dx>0?`+${Math.round(Math.abs(dx)*100)}% toward Policy-driven`:`+${Math.round(Math.abs(dx)*100)}% toward Market-driven`);if(Math.abs(dy)>0.06)parts.push(dy<0?`+${Math.round(Math.abs(dy)*100)}% toward Planet-first`:`+${Math.round(Math.abs(dy)*100)}% toward Cost-first`);return parts}
function seedDraft(before,after){const dx=after.x-before.x,dy=after.y-before.y,xDir=Math.abs(dx)<0.06?"":dx>0?"more policy-driven":"more market-driven",yDir=Math.abs(dy)<0.06?"":dy<0?"more focused on planetary costs":"more cost-conscious",dirs=[xDir,yDir].filter(Boolean),dirStr=dirs.length?`moved me ${dirs.join(" and ")}`:"held, though I read more carefully";return`Reading this ${dirStr}. The argument about subsidy cascades insulating incumbents from efficiency pressure was the specific point that shifted my thinking.`}
function buildPlot(opts){const{id,value,before,locked,size}=opts,S=size||260,PAD=36,IN=S-PAD*2,cx=PAD+value.x*IN,cy=PAD+value.y*IN,bx=before?PAD+before.x*IN:null,by=before?PAD+before.y*IN:null,hasBefore=before&&(Math.abs(value.x-before.x)>0.025||Math.abs(value.y-before.y)>0.025);return`<div style="display:flex;flex-direction:column;align-items:center"><svg id="${id}" width="${S}" height="${S}" style="display:block;cursor:${locked?'default':'crosshair'};user-select:none;touch-action:none" data-locked="${locked?1:0}" data-pad="${PAD}" data-in="${IN}"><defs><marker id="arr-${id}" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#d4a84a"/></marker></defs><rect x="${PAD}" y="${PAD}" width="${IN}" height="${IN}" fill="#fffdf8" stroke="#d8ceb8" stroke-width="1" rx="4"/><rect x="${PAD}" y="${PAD}" width="${IN/2}" height="${IN/2}" fill="rgba(212,168,74,0.05)"/><rect x="${PAD+IN/2}" y="${PAD}" width="${IN/2}" height="${IN/2}" fill="rgba(212,168,74,0.09)"/><rect x="${PAD}" y="${PAD+IN/2}" width="${IN/2}" height="${IN/2}" fill="rgba(90,82,72,0.03)"/><rect x="${PAD+IN/2}" y="${PAD+IN/2}" width="${IN/2}" height="${IN/2}" fill="rgba(90,82,72,0.05)"/><line x1="${PAD}" y1="${PAD+IN/2}" x2="${PAD+IN}" y2="${PAD+IN/2}" stroke="#d8ceb8" stroke-width="1"/><line x1="${PAD+IN/2}" y1="${PAD}" x2="${PAD+IN/2}" y2="${PAD+IN}" stroke="#d8ceb8" stroke-width="1"/><line x1="${PAD}" y1="${PAD+IN/4}" x2="${PAD+IN}" y2="${PAD+IN/4}" stroke="#e8e0d0" stroke-width="0.5" stroke-dasharray="3,5"/><line x1="${PAD}" y1="${PAD+3*IN/4}" x2="${PAD+IN}" y2="${PAD+3*IN/4}" stroke="#e8e0d0" stroke-width="0.5" stroke-dasharray="3,5"/><line x1="${PAD+IN/4}" y1="${PAD}" x2="${PAD+IN/4}" y2="${PAD+IN}" stroke="#e8e0d0" stroke-width="0.5" stroke-dasharray="3,5"/><line x1="${PAD+3*IN/4}" y1="${PAD}" x2="${PAD+3*IN/4}" y2="${PAD+IN}" stroke="#e8e0d0" stroke-width="0.5" stroke-dasharray="3,5"/><text x="${PAD+IN/2}" y="${PAD-8}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#d4a84a" letter-spacing="0.8">${ARTICLE.yTop.toUpperCase()}</text><text x="${PAD+IN/2}" y="${PAD+IN+18}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#7a7068" letter-spacing="0.8">${ARTICLE.yBot.toUpperCase()}</text><text x="${PAD-10}" y="${PAD+IN/2}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#7a7068" letter-spacing="0.8" transform="rotate(-90 ${PAD-10} ${PAD+IN/2})">${ARTICLE.xLeft.toUpperCase()}</text><text x="${PAD+IN+10}" y="${PAD+IN/2}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#d4a84a" letter-spacing="0.8" transform="rotate(90 ${PAD+IN+10} ${PAD+IN/2})">${ARTICLE.xRight.toUpperCase()}</text>${hasBefore&&bx!==null?`<circle cx="${bx}" cy="${by}" r="10" fill="rgba(90,82,72,0.1)" stroke="rgba(90,82,72,0.28)" stroke-width="1.5" stroke-dasharray="3,2"/><text x="${bx}" y="${by+22}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#9a8e80">before</text><line x1="${bx}" y1="${by}" x2="${cx}" y2="${cy}" stroke="#d4a84a" stroke-width="1.8" marker-end="url(#arr-${id})" opacity="0.75"/>`:''}<circle cx="${cx}" cy="${cy}" r="14" fill="rgba(212,168,74,0.12)"/><circle cx="${cx}" cy="${cy}" r="7.5" fill="#d4a84a"/><circle cx="${cx}" cy="${cy}" r="2.8" fill="#fffdf8"/></svg></div>`}
function buildDeltaViz(before,after){const S=300,PAD=42,IN=S-PAD*2,bx=PAD+before.x*IN,by=PAD+before.y*IN,ax=PAD+after.x*IN,ay=PAD+after.y*IN,dist=getDist(before,after),noMove=dist<10,descs=deltaDesc(before,after);return`<div style="display:flex;flex-direction:column;align-items:center;gap:16px"><svg width="${S}" height="${S}" style="display:block"><defs><marker id="da" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d4a84a"/></marker></defs><rect x="${PAD}" y="${PAD}" width="${IN}" height="${IN}" fill="#fffdf8" stroke="#d8ceb8" stroke-width="1" rx="4"/><rect x="${PAD}" y="${PAD}" width="${IN/2}" height="${IN/2}" fill="rgba(212,168,74,0.05)"/><rect x="${PAD+IN/2}" y="${PAD}" width="${IN/2}" height="${IN/2}" fill="rgba(212,168,74,0.09)"/><rect x="${PAD}" y="${PAD+IN/2}" width="${IN/2}" height="${IN/2}" fill="rgba(90,82,72,0.03)"/><rect x="${PAD+IN/2}" y="${PAD+IN/2}" width="${IN/2}" height="${IN/2}" fill="rgba(90,82,72,0.05)"/><line x1="${PAD}" y1="${PAD+IN/2}" x2="${PAD+IN}" y2="${PAD+IN/2}" stroke="#d8ceb8" stroke-width="1"/><line x1="${PAD+IN/2}" y1="${PAD}" x2="${PAD+IN/2}" y2="${PAD+IN}" stroke="#d8ceb8" stroke-width="1"/><text x="${PAD+IN/2}" y="${PAD-10}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#d4a84a" letter-spacing="1">PLANET-FIRST</text><text x="${PAD+IN/2}" y="${PAD+IN+20}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#7a7068" letter-spacing="1">COST-FIRST</text><text x="${PAD-12}" y="${PAD+IN/2}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#7a7068" letter-spacing="1" transform="rotate(-90 ${PAD-12} ${PAD+IN/2})">MARKET</text><text x="${PAD+IN+12}" y="${PAD+IN/2}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#d4a84a" letter-spacing="1" transform="rotate(90 ${PAD+IN+12} ${PAD+IN/2})">POLICY</text><circle cx="${bx}" cy="${by}" r="20" fill="none" stroke="rgba(90,82,72,0.1)" stroke-width="1" stroke-dasharray="2,5"/><circle cx="${bx}" cy="${by}" r="10" fill="rgba(90,82,72,0.12)" stroke="rgba(90,82,72,0.32)" stroke-width="1.5"/><text x="${bx}" y="${by+24}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#9a8e80">BEFORE</text>${!noMove?`<line x1="${bx}" y1="${by}" x2="${ax}" y2="${ay}" stroke="#d4a84a" stroke-width="2.2" marker-end="url(#da)" opacity="0.85"/>`:''}<circle cx="${ax}" cy="${ay}" r="15" fill="rgba(212,168,74,0.14)"/><circle cx="${ax}" cy="${ay}" r="8" fill="#d4a84a"/><circle cx="${ax}" cy="${ay}" r="3" fill="#fffdf8"/><text x="${ax}" y="${ay+26}" text-anchor="middle" font-family="'DM Mono',monospace" font-size="8" fill="#d4a84a">AFTER</text></svg>${noMove?`<p style="font-family:'Source Serif 4',serif;font-size:0.88rem;font-style:italic;color:#5a5248;text-align:center;max-width:240px">Your position held across the reading. A stable position after serious engagement is a considered one.</p>`:descs.length?`<div style="display:flex;flex-direction:column;gap:5px;align-items:center">${descs.map(d=>`<div class="mono-sm" style="color:#d4a84a">${d}</div>`).join('')}</div>`:''}</div>`}
function render(){const s=state,moved=getDist(s.before,s.after)>12,progHtml=`<div class="progress-track">${STEPS.map((label,i)=>`<div class="prog-item"><div class="prog-dot ${i<s.step?'done':i===s.step?'active':'future'}">${i<s.step?'✓':i+1}</div><span class="prog-label ${i<s.step?'done':i===s.step?'active':'future'}">${label}</span>${i<STEPS.length-1?`<div class="prog-line ${i<s.step?'done':'future'}"></div>`:''}</div>`).join('')}</div>`;
let content='';
if(s.step===0){content=`<div><div class="eyebrow">Economics · Renewable Energy · 🥇 Forum</div><h1 class="display">${ARTICLE.title}</h1><p class="subtitle" style="margin-bottom:28px">${ARTICLE.subtitle}</p><div class="card"><div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;color:#1c1814;margin-bottom:8px">Before you read</div><p class="subtitle" style="margin-bottom:22px">Where do you currently stand on this question? Place your marker on the map.</p>${buildPlot({id:'plot-before',value:s.before,locked:false,size:260})}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px"><p class="mono-sm" style="color:#7a7068">Private until you choose to share. Never used to filter what you see.</p><button class="btn-gold" onclick="advance()">Lock in and read →</button></div></div></div>`;}
else if(s.step===1){const pct=s.readProgress;content=`<div><div class="eyebrow">Economics · Renewable Energy · 🥇 Forum</div><h1 class="display" style="font-size:1.75rem">${ARTICLE.title}</h1><p class="subtitle" style="margin-bottom:20px">${ARTICLE.subtitle}</p><div class="read-bar"><div class="read-fill" id="read-fill" style="width:${pct}%"></div></div><div class="prose"><p>The standard economic argument for renewable energy subsidies proceeds cleanly: clean energy has positive externalities and negative private returns relative to social returns. Correct the externality, subsidize the gap. The argument is not wrong. The problem is that it stops too early.</p><p>What the gap-correction model does not account for is the structure of the market the subsidy creates. Subsidies are not neutral interventions that simply add financial support to an otherwise unchanged dynamic. They restructure who can survive and for how long.</p><p>The most defensible subsidies are time-bounded, technology-specific, and structured to become unnecessary as the technology matures. The problematic ones are open-ended market structure interventions that insulate producers from efficiency pressure precisely when efficiency pressure would do the most work.</p><p>This does not make renewable energy subsidies wrong. It makes the case for them more complicated, and more dependent on the specific mechanism than advocates typically acknowledge.</p></div>${pct>=100?`<div style="margin-top:28px;padding:18px 22px;background:rgba(212,168,74,0.06);border:1px solid rgba(212,168,74,0.18);border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:16px"><p style="font-family:'Source Serif 4',serif;font-size:0.88rem;font-style:italic;color:#5a5248">Article complete. Ready to check back in?</p><button class="btn-gold" onclick="advance()">Continue →</button></div>`:`<p class="mono-sm" style="color:#7a7068;margin-top:20px;text-align:center">Reading…</p>`}</div>`;}
else if(s.step===2){content=`<div><div class="eyebrow">Post-read check-in</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:600;color:#1c1814;margin-bottom:8px;line-height:1.2">Has your sense of it shifted?</div><p class="subtitle" style="margin-bottom:24px">You don't have to move the dot. A consistent position is worth knowing too.</p><div style="display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:24px"><div><div class="plot-label">Before</div>${buildPlot({id:'plot-before2',value:s.before,locked:true,size:230})}</div><div><div class="plot-label gold">After — drag to update</div>${buildPlot({id:'plot-after',value:s.after,before:s.afterTouched?s.before:null,locked:false,size:230})}</div></div><div style="display:flex;justify-content:flex-end"><button class="btn-gold" onclick="advance()">See my delta →</button></div></div>`;}
else if(s.step===3){content=`<div><div class="eyebrow">Your delta — private</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:#1c1814;margin-bottom:8px;line-height:1.2">${moved?"Your position moved.":"Your position held."}</div><p class="subtitle" style="margin-bottom:24px;max-width:480px">${moved?"This is private. Only you see it, unless you choose to share it.":"Consistency is data too. A position unchanged after serious engagement is a considered one."}</p>${buildDeltaViz(s.before,s.after)}${moved?`<div class="reviser-card"><div style="font-size:1.4rem;line-height:1;flex-shrink:0;margin-top:2px">↻</div><div><div style="font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;color:#1c1814;margin-bottom:4px">Reviser pathway</div><p style="font-family:'Source Serif 4',serif;font-size:0.82rem;font-style:italic;color:#5a5248;line-height:1.5">When a contributor publicly acknowledges a position shift with a reasoned explanation, it counts toward the Reviser archetype.</p></div></div>`:''}<div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn-gold" onclick="advance()">${moved?"Decide what to share →":"Go to comments →"}</button></div></div>`;}
else if(s.step===4){content=`<div><div class="eyebrow">${moved?"Share or keep private":"Join the discussion"}</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.55rem;font-weight:600;color:#1c1814;margin-bottom:8px;line-height:1.2">${moved?"Would you like to note the shift?":"Head to the comments"}</div><p class="subtitle" style="margin-bottom:24px;max-width:500px">${moved?"You can note what moved and why — in your own words. Or keep it private.":"Your position was unchanged. You can comment without any delta reference."}</p>${moved?`<button class="choice-btn" onclick="choose('yes')"><span style="font-size:1.1rem;margin-top:2px">↻</span><div><div class="choice-title">Note the shift in a comment</div><div class="choice-desc">The platform drafts a starting point. Your words, your edit, your call.</div></div></button><button class="choice-btn" onclick="choose('no')"><span style="font-size:1.1rem;margin-top:2px">🔒</span><div><div class="choice-title">Keep it private</div><div class="choice-desc">Recorded in your contributor history only.</div></div></button>`:`<button class="btn-gold" onclick="choose('skip')">Go to comments →</button>`}</div>`;}
else if(s.step===5){content=`<div><div class="eyebrow">Draft — Position acknowledgment</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;color:#1c1814;margin-bottom:8px;line-height:1.2">Here's a starting point. Make it yours.</div><p class="subtitle" style="margin-bottom:18px">The platform noticed the shift and drafted something. The words need to be yours.</p><div class="delta-chip">DELTA ACKNOWLEDGED</div><div class="mono-sm" style="color:#7a7068;margin-bottom:14px">This marker attaches to your comment and is visible to other readers.</div><textarea id="draft-area" oninput="updateDraft(this.value)">${s.draft}</textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><div class="mono-sm" style="color:#7a7068">Will pass through the classification engine before posting.</div><button class="btn-gold" onclick="advance()">Submit for classification →</button></div></div>`;}
else if(s.step===6){content=`<div><div class="eyebrow">${s.publicChoice==='yes'?"Queued":"Recorded"}</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:#1c1814;margin-bottom:10px;line-height:1.2">${s.publicChoice==='yes'?"Your acknowledgment is in the queue.":"Delta recorded privately."}</div><p class="subtitle" style="margin-bottom:28px;max-width:500px">${s.publicChoice==='yes'?"The engine will classify it and suggest a tier before it posts.":"Your delta is part of your contributor history."}</p>${moved?`<div class="card" style="margin-bottom:20px"><div style="display:flex;gap:14px;align-items:flex-start"><div style="font-size:1.8rem;line-height:1;margin-top:2px">↻</div><div><div style="font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;color:#1c1814;margin-bottom:5px">The Reviser</div><p style="font-family:'Source Serif 4',serif;font-size:0.84rem;font-style:italic;color:#5a5248;line-height:1.55;margin-bottom:16px">The only archetype earned through change rather than pattern.</p><div class="mono-sm" style="color:#7a7068;margin-bottom:10px">PROGRESS TOWARD REVISER</div><div style="display:flex;gap:10px;align-items:center"><div class="rev-circle ${s.publicChoice==='yes'?'earned':'empty'}">${s.publicChoice==='yes'?'✓':'1'}</div><div class="rev-circle empty">2</div><div class="rev-circle empty">3</div><span class="mono-sm" style="color:#5a5248;margin-left:6px">${s.publicChoice==='yes'?'1 of 3 public acknowledgments':'0 of 3 — this shift was private'}</span></div></div></div></div>`:''}<div class="card-sm" style="margin-bottom:24px"><div class="mono-sm" style="color:#5a5248;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:14px">Community delta — this article</div><div style="display:flex;gap:16px;flex-wrap:wrap">${[{label:"Shifted toward Policy-driven",pct:38},{label:"Position unchanged",pct:31},{label:"Shifted toward Planet-first",pct:22},{label:"Shifted toward Market-driven",pct:9}].map(d=>`<div class="agg-bar-wrap"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="mono-sm" style="color:#5a5248">${d.label}</span><span class="mono-sm" style="color:#d4a84a">${d.pct}%</span></div><div class="agg-bar-track"><div class="agg-bar-fill" style="width:${d.pct}%"></div></div></div>`).join('')}</div><div class="mono-sm" style="color:#7a7068;margin-top:14px">84 readers completed both snapshots.</div></div><div style="text-align:center"><button class="btn-outline" onclick="reset()">↺ Reset prototype</button></div></div>`;}
document.getElementById('app').innerHTML=progHtml+content;
attachPlotListeners();
if(s.step===1)startReadTimer();
}
function attachPlotListeners(){attachToPlot('plot-before','before');attachToPlot('plot-after','after')}
function attachToPlot(id,field){const svg=document.getElementById(id);if(!svg||svg.dataset.locked==='1')return;const PAD=parseFloat(svg.dataset.pad),IN=parseFloat(svg.dataset.in);function toValue(clientX,clientY){const rect=svg.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(clientX-rect.left-PAD)/IN)),y:Math.max(0,Math.min(1,(clientY-rect.top-PAD)/IN))}}
svg.addEventListener('mousedown',e=>{e.preventDefault();state.dragging=true;state.activePlot=field;const v=toValue(e.clientX,e.clientY);if(field==='before')state.before=v;else{state.after=v;state.afterTouched=true}render()});
svg.addEventListener('mousemove',e=>{if(!state.dragging||state.activePlot!==field)return;e.preventDefault();const v=toValue(e.clientX,e.clientY);if(field==='before')state.before=v;else{state.after=v;state.afterTouched=true}});
svg.addEventListener('mouseup',()=>{state.dragging=false;render()});
svg.addEventListener('mouseleave',e=>{if(state.dragging&&state.activePlot===field){state.dragging=false;render()}});
svg.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];state.dragging=true;state.activePlot=field;const v=toValue(t.clientX,t.clientY);if(field==='before')state.before=v;else{state.after=v;state.afterTouched=true}render()},{passive:false});
svg.addEventListener('touchmove',e=>{e.preventDefault();if(!state.dragging||state.activePlot!==field)return;const t=e.touches[0];const v=toValue(t.clientX,t.clientY);if(field==='before')state.before=v;else{state.after=v;state.afterTouched=true}},{passive:false});
svg.addEventListener('touchend',()=>{state.dragging=false;render()})}
function advance(){state.step++;render()}
function choose(opt){state.publicChoice=opt;if(opt==='yes'){state.draft=seedDraft(state.before,state.after);state.step=5}else{state.step=6}render()}
function updateDraft(val){state.draft=val}
function reset(){clearInterval(state.readTimer);state={step:0,before:{x:0.44,y:0.42},after:{x:0.44,y:0.42},afterTouched:false,publicChoice:null,draft:"",readProgress:0,readTimer:null,dragging:false,activePlot:null};render()}
function startReadTimer(){clearInterval(state.readTimer);state.readTimer=setInterval(()=>{state.readProgress=Math.min(100,state.readProgress+1.8);const bar=document.getElementById('read-fill');if(bar)bar.style.width=state.readProgress+'%';if(state.readProgress>=100){clearInterval(state.readTimer);render()}},70)}
render();
</script>
</body>

# Supabase CLI configuration. Minimal on purpose; the CLI fills defaults.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "dialecta"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
